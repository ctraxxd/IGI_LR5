services:
  - type: web
    name: museum-lr5
    env: python
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: museum-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
    disk:
      name: logs
      mountPath: /app/logs
      sizeGB: 1
      createDir: true
databases:
  - name: museum-db
    databaseName: museum_db
    user: museum_user
    plan: starter
