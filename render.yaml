services:
  - type: web
    name: household-store
    env: python
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: store-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
    disk:
      name: logs
      mountPath: /app/logs
      sizeGB: 1
databases:
  - name: store-db
    databaseName: store_db
    user: store_user
    plan: starter
