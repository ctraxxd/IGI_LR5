services:
  - type: web
    name: museum-lr5
    env: python
    region: frankfurt
    plan: starter
    branch: main
    dockerfilePath: Dockerfile
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: museum-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: RENDER
        value: true
      - key: TIME_ZONE
        value: Europe/Minsk
    disk:
      name: logs
      mountPath: /app/logs
      sizeGB: 1
      createDir: true
databases:
  - name: museum-db
    databaseName: museum_db
    user: museum_user
    plan: starter