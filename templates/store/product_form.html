{% extends 'store/base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ action }} Product{% endblock %}
{% block content %}
<h1>{{ action }} Product</h1>
<form method="post" class="mt-4">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary mt-3">{{ action }}</button>
    <a href="{% url 'product_list' %}" class="btn btn-secondary mt-3">Cancel</a>
</form>
{% endblock %}
