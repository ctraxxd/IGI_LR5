{% extends 'museum/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Purchase Ticket{% endblock %}
{% block content %}
<h1>Purchase Ticket</h1>
<form method="post" class="mt-4">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary mt-3">Purchase</button>
    <a href="{% url 'ticket_list' %}" class="btn btn-secondary mt-3">Cancel</a>
</form>
{% endblock %}
